<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API</title>
    <meta name="title" content="New API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#fff" />
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <script>
      ;(() => {
        const presetMatch = document.cookie.match(
          /(?:^|;\s*)theme_preset=([^;]+)/
        )
        const preset = presetMatch ? decodeURIComponent(presetMatch[1]) : ''
        if (!preset || preset === 'default') {
          document.body.removeAttribute('data-theme-preset')
          return
        }
        document.body.setAttribute('data-theme-preset', preset)
      })()
    </script>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
