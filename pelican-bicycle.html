  <style>
    :root { color-scheme: light; --ink: #233f49; --muted: #5c756f; --paper: #f4f1e9; --accent: #dd7258; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { width: min(1120px, calc(100% - 64px)); margin: 38px auto 26px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin: 0 6px 26px; }
    .eyebrow { margin: 0 0 13px; font-size: 11px; font-weight: 600; letter-spacing: .2em; }
    .eyebrow::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 10px; border-radius: 50%; background: var(--accent); }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 44px); font-weight: 600; letter-spacing: -.04em; }
    .subtitle { margin: 12px 0 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .edition { margin-bottom: 4px; color: var(--muted); font-size: 11px; letter-spacing: .12em; text-align: right; line-height: 1.9; white-space: nowrap; }
    .scene { position: relative; overflow: hidden; border: 1px solid #ccdcd0; border-radius: 22px; background: #e7f0e4; }
    .scene > svg { display: block; width: 100%; height: auto; }
    .scene-label { position: absolute; top: 23px; left: 26px; margin: 0; font-size: 11px; color: #4d7265; letter-spacing: .14em; }
    .scene-label span { display: block; margin-top: 7px; font-size: 12px; letter-spacing: .08em; }
    .scene-caption { position: absolute; right: 25px; bottom: 21px; margin: 0; color: #627462; font-size: 11px; letter-spacing: .12em; }
    .controls { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 18px; padding: 23px 5px; }
    .playback { display: flex; align-items: center; gap: 15px; }
    button { min-height: 44px; border: 1px solid #25473f; border-radius: 30px; padding: 0 21px; background: #25473f; color: #fff9ec; font: inherit; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
    button:hover { background: #345d52; }
    button:focus-visible, input:focus-visible { outline: 3px solid #c96247; outline-offset: 4px; }
    .pause-icon { width: 11px; height: 12px; border-left: 3px solid currentColor; border-right: 3px solid currentColor; }
    .is-paused .pause-icon { width: 0; height: 0; border: 6px solid transparent; border-left: 9px solid currentColor; border-right: 0; }
    #status { color: var(--muted); font-size: 12px; }
    .speed-control { display: flex; align-items: center; gap: 13px; color: var(--muted); font-size: 12px; }
    input[type="range"] { width: 128px; min-height: 44px; margin: 0; accent-color: #345d52; cursor: pointer; }
    output { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 3.8em; text-align: right; }
    footer { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid #dcded1; padding: 18px 5px 0; color: var(--muted); font-size: 11px; letter-spacing: .07em; }
    noscript p { padding: 0 6px; color: var(--muted); font-size: 13px; }
    [hidden] { display: none !important; }
    @media (max-width: 620px) {

      .playback { gap: 10px; }
      .speed-control { width: 100%; justify-content: space-between; }
      input[type="range"] { flex: 1; max-width: 210px; }
      footer { font-size: 10px; letter-spacing: 0; }

  <script>
    'use strict';
    // Project Button/Slider require React and Base UI. Native controls keep this standalone artwork usable offline without a build.
    const byId = (id) => document.getElementById(id);
    const parts = Object.fromEntries([
      'rear-wheel', 'front-wheel', 'chainring', 'far-crank', 'near-crank',
      'far-foot', 'near-foot', 'bird', 'eye', 'tail', 'scarf-long', 'scarf-short',
      'clouds', 'gulls', 'road', 'ripples', 'breeze',
    ].map((id) => [id, byId(id)]));
    const legs = ['far', 'near'].map((side) => ({
      paths: Array.from(byId(`${side}-leg`).children),
      foot: parts[`${side}-foot`],
      crank: parts[`${side}-crank`],
      hipX: side === 'near' ? 399 : 420,
      hipY: side === 'near' ? 427 : 421,
      phase: side === 'near' ? 0 : Math.PI,
    }));
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const button = byId('toggle');
    const speedInput = byId('speed');
    let playing = !reducedMotion.matches;
    let speed = 1;
    let elapsed = 0;
    let motionPreferenceOverridden = false;
    let previousTime = null;
    let frameId = null;

    function draw(time) {
      const angle = time * Math.PI * 1.1 + 2.5;
      const degrees = angle * 180 / Math.PI;
      const bob = Math.sin(angle * 2) * 1.6;
      // Ground speed and wheel circumference agree; the gear ratio is 1.45.
      const distance = time * Math.PI * 1.1 * 1.45 * 112 * .8;
      parts['rear-wheel'].setAttribute('transform', `rotate(${degrees * 1.45})`);
      parts['front-wheel'].setAttribute('transform', `rotate(${degrees * 1.45})`);
      parts.chainring.setAttribute('transform', `rotate(${degrees})`);
      parts.bird.setAttribute('transform', `translate(0 ${bob})`);

      // Two-link inverse kinematics keeps both feet attached to opposite pedals.
      for (const leg of legs) {
        const pedalX = 448 + Math.cos(angle + leg.phase) * 54;
        const pedalY = 586 + Math.sin(angle + leg.phase) * 54;
        const ankleX = pedalX;
        const ankleY = pedalY - 22;
        const hipY = leg.hipY + bob;
        const dx = ankleX - leg.hipX;
        const dy = ankleY - hipY;
        const length = Math.hypot(dx, dy);
        const thigh = 105;
        const shin = 109;
        const along = (thigh ** 2 - shin ** 2 + length ** 2) / (2 * length);
        const bend = Math.sqrt(Math.max(0, thigh ** 2 - along ** 2));
        const kneeX = leg.hipX + dx / length * along + dy / length * bend;
        const kneeY = hipY + dy / length * along - dx / length * bend;
        const path = `M${leg.hipX} ${hipY}L${kneeX} ${kneeY}L${ankleX} ${ankleY}`;
        for (const segment of leg.paths) segment.setAttribute('d', path);
        leg.foot.setAttribute('transform', `translate(${pedalX} ${pedalY - 17})`);
        leg.crank.setAttribute('d', `M448 586L${pedalX} ${pedalY}`);
      }

      parts['scarf-long'].setAttribute('transform', `rotate(${Math.sin(time * 7) * 5} 450 297)`);
      parts['scarf-short'].setAttribute('transform', `rotate(${Math.sin(time * 7 - 1) * 7} 451 298)`);
      parts.tail.setAttribute('transform', `rotate(${Math.sin(angle * 2) * 2} 325 340)`);
      const blink = time % 5.8;
      parts.eye.setAttribute('transform', `scale(1 ${blink > 5.54 ? Math.max(.08, Math.abs(blink - 5.67) / .13) : 1})`);
      parts.clouds.setAttribute('transform', `translate(${-((time * 9) % 1280)} 0)`);
      parts.gulls.setAttribute('transform', `translate(0 ${Math.sin(time * 1.8) * 4})`);
      parts.road.setAttribute('patternTransform', `translate(${-distance % 250} 0)`);
      parts.ripples.setAttribute('patternTransform', `translate(${-distance * .12 % 350} 0)`);
      parts.breeze.setAttribute('opacity', String(.5 + .25 * Math.sin(time * 5)));
    }

    function frame(timestamp) {
      if (previousTime !== null) elapsed += Math.min((timestamp - previousTime) / 1000, .1) * speed;
      previousTime = timestamp;
      draw(elapsed);
      frameId = requestAnimationFrame(frame);
    }

    function updatePlayback() {
      if (frameId !== null) cancelAnimationFrame(frameId);
      frameId = null;
      previousTime = null;
      button.classList.toggle('is-paused', !playing);
      byId('live-label').textContent = playing ? '正在兜风' : '休息片刻';
      byId('live-dot').classList.toggle('resting', !playing);
      button.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
      byId('toggle-label').textContent = playing ? '暂停骑行' : '继续出发';
      byId('status').textContent = playing ? '正在悠闲骑行' : '停下来，看看风景';
      if (playing && !document.hidden) frameId = requestAnimationFrame(frame);
    }

    button.addEventListener('click', () => {
      motionPreferenceOverridden = true;
      playing = !playing;
      updatePlayback();
    });
    byId('restart').addEventListener('click', () => {
      elapsed = 0;
      previousTime = null;
      draw(0);
      byId('status').textContent = playing ? '从海岸线重新出发' : '已回到出发点';
    });
    document.addEventListener('keydown', (event) => {
      if (event.code !== 'Space' || event.repeat || event.ctrlKey || event.altKey || event.metaKey) return;
      if (event.target.closest('button, input, select, textarea, a, [contenteditable]')) return;
      event.preventDefault();
      button.click();
    });
    speedInput.addEventListener('input', () => {
      speed = Number(speedInput.value);
      byId('speed-value').value = `${speed.toFixed(2)}×`;
      speedInput.setAttribute('aria-valuetext', `${speed} 倍速度`);
    });
    reducedMotion.addEventListener('change', () => {
      if (motionPreferenceOverridden) return;
      playing = !reducedMotion.matches;
      updatePlayback();
    });
    document.addEventListener('visibilitychange', updatePlayback);
    byId('controls').hidden = false;
    draw(0);
    updatePlayback();
  </script>
</body>
</html>
