<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title description">
  <title id="title">骑自行车的鹈鹕</title>
  <desc id="description">一只戴珊瑚红头盔、系蓝绿色围巾的白色鹈鹕，踩着自行车在海边悠闲前行。暖黄色的太阳、奶油色背景与复古蓝绿色车架构成一幅轻快的矢量插画。</desc>
  <defs>
    <g id="wheel" fill="none">
      <circle r="127" fill="#f8f2df" stroke="#263c3b" stroke-width="13"/>
      <circle r="116" stroke="#c9cdbd" stroke-width="3"/>
      <g stroke="#a8b9af" stroke-width="2.5">
        <path d="M0-113V113M-113 0H113M-80-80 80 80M-80 80 80-80M-43-104 43 104M-104-43 104 43M-104 43 104-43M-43 104 43-104"/>
      </g>
      <circle r="10" fill="#f5ba64" stroke="#263c3b" stroke-width="4"/>
    </g>
  </defs>

  <!-- A quiet coastal afternoon. -->
  <rect width="1000" height="800" rx="28" fill="#f8f2df"/>
  <circle cx="727" cy="255" r="177" fill="#f3c76f"/>
  <path d="M102 430C221 411 281 442 378 429S551 409 651 429 808 444 900 423V587H102Z" fill="#d9e8de"/>
  <g fill="none" stroke="#a9c9bc" stroke-width="4" stroke-linecap="round">
    <path d="M126 476h67m26 0h27m534-9h80m-47 30h53M115 533h93m574 14h99"/>
  </g>
  <g fill="none" stroke="#687e72" stroke-width="3.5" stroke-linecap="round">
    <path d="M145 247q15-14 29 0 15-14 29 0m41-56q11-11 22 0 11-11 22 0"/>
  </g>
  <ellipse cx="521" cy="743" rx="351" ry="15" fill="#e4dcc3"/>
  <path d="M128 741h747" stroke="#b8bfaa" stroke-width="3" stroke-linecap="round"/>

  <!-- Wheels, chain, frame, and steering. -->
  <use href="#wheel" x="290" y="605"/>
  <use href="#wheel" x="745" y="605"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M290 589 494 577Q527 579 527 605T494 633L290 618Q274 605 290 589Z" fill="none" stroke="#697870" stroke-width="4"/>
    <g fill="none" stroke="#263c3b" stroke-width="17">
      <path d="M290 605 435 440 498 605ZM435 440 666 440M498 605 680 477M666 430 681 479 745 605"/>
    </g>
    <g fill="none" stroke="#388f87" stroke-width="10">
      <path d="M290 605 435 440 498 605ZM435 440 666 440M498 605 680 477M666 430 681 479 745 605"/>
    </g>
    <path d="M435 439 422 403" stroke="#263c3b" stroke-width="9"/>
    <path d="M391 407Q421 400 453 410" fill="none" stroke="#263c3b" stroke-width="17"/>
    <path d="M666 431 651 387H689Q710 387 709 407" fill="none" stroke="#263c3b" stroke-width="9"/>
    <path d="M677 387h19" stroke="#b5764f" stroke-width="13"/>
    <path d="M700 408Q727 458 713 489" fill="none" stroke="#697870" stroke-width="2.5"/>
    <circle cx="498" cy="605" r="31" fill="#f8f2df" stroke="#263c3b" stroke-width="5"/>
    <circle cx="498" cy="605" r="22" fill="#d5ded0"/>
    <path d="M450 568 546 642" stroke="#263c3b" stroke-width="8"/>
    <path d="M431 568h35M532 648h41" stroke="#263c3b" stroke-width="8"/>
    <circle cx="498" cy="605" r="7" fill="#263c3b"/>
  </g>

  <!-- Far leg: the foot lands on the opposite pedal. -->
  <path d="M446 397 482 467 439 541" fill="none" stroke="#263c3b" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M446 397 482 467 439 541" fill="none" stroke="#d99645" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M437 536Q448 540 458 555L470 563Q454 571 426 562Z" fill="#e6a74e" stroke="#263c3b" stroke-width="4" stroke-linejoin="round"/>

  <!-- Tail feathers and the pelican's curved neck. -->
  <g stroke="#263c3b" stroke-width="5" stroke-linejoin="round">
    <path d="M383 346 310 305 330 349 299 330Q314 372 382 386Z" fill="#c7d6cf"/>
    <path d="M348 341C394 311 446 324 493 346C524 334 530 309 526 278C521 249 536 223 551 204C537 182 539 155 562 137C588 116 623 126 640 150C657 175 644 201 625 222C602 248 586 271 593 306C601 340 617 366 592 390C564 422 527 425 481 415C419 424 365 409 345 376C335 361 336 350 348 341Z" fill="#fffdf1"/>
  </g>
  <path d="M558 233C546 276 565 310 552 347C541 379 510 393 475 393C423 398 380 383 350 359C345 395 399 420 481 410C536 426 578 408 590 387C603 367 581 336 583 304C580 272 591 248 607 229Z" fill="#e0e8db"/>

