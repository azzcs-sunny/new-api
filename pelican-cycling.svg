  <path d="M625 179 849 202C826 235 780 267 726 267C677 267 646 245 628 217Z" fill="#efae66" stroke="#263c3b" stroke-width="5" stroke-linejoin="round"/>
  <path d="M645 211C674 248 736 259 795 232" fill="none" stroke="#dc8e55" stroke-width="4" stroke-linecap="round"/>
  <path d="M623 173C696 173 792 183 864 202Q866 210 855 214L623 206Z" fill="#f6c45f" stroke="#263c3b" stroke-width="5" stroke-linejoin="round"/>
  <path d="M643 187 821 202" fill="none" stroke="#ffe1a0" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="607" cy="167" rx="12" ry="14" fill="#fff"/>
  <circle cx="611" cy="168" r="6.5" fill="#263c3b"/>
  <circle cx="613" cy="166" r="2" fill="#fff"/>
  <path d="M594 146q11-7 21 0" fill="none" stroke="#263c3b" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="595" cy="196" rx="12" ry="7" fill="#e8afa0" opacity=".7"/>

  <!-- A snug helmet and a scarf streaming behind. -->
  <path d="M540 156C530 124 549 93 580 90C617 85 641 108 642 132L540 156Z" fill="#de735b" stroke="#263c3b" stroke-width="5" stroke-linejoin="round"/>
  <path d="M544 149 648 129" stroke="#263c3b" stroke-width="7" stroke-linecap="round"/>
  <g fill="none" stroke="#a84e41" stroke-width="6" stroke-linecap="round">
    <path d="M559 117 556 131m23-23-1 18m22-19 4 16m16-10 5 7"/>
  </g>
  <path d="M552 154 570 207 590 217 611 210" fill="none" stroke="#263c3b" stroke-width="4" stroke-linecap="round"/>
  <rect x="580" y="209" width="13" height="10" rx="3" fill="#f8f2df" stroke="#263c3b" stroke-width="3"/>
  <path d="M545 243C513 231 491 249 455 229L466 248 450 261C487 273 516 258 542 266Z" fill="#3d9288" stroke="#263c3b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M537 241Q563 259 594 254L590 273Q557 278 532 260Z" fill="#4ba398" stroke="#263c3b" stroke-width="4"/>

  <!-- One wing reaches the handlebar; feathers remain visible. -->
  <path d="M413 344C450 319 487 335 523 352C565 371 608 375 655 374C666 374 681 381 685 389C666 402 643 397 624 395C568 405 518 401 466 385C438 378 420 365 413 344Z" fill="#eff1e3" stroke="#263c3b" stroke-width="5" stroke-linejoin="round"/>
  <g fill="none" stroke="#a5bbb0" stroke-width="3.5" stroke-linecap="round">
    <path d="M434 348q45 29 99 32m-82-35q40 23 80 25m-59-27q27 13 48 16"/>
  </g>
  <path d="M654 384q10 7 13 12m-25-12q10 6 14 12" fill="none" stroke="#263c3b" stroke-width="3" stroke-linecap="round"/>

  <!-- Near leg and webbed foot are aligned with the low pedal. -->
  <path d="M500 406 548 478 520 613" fill="none" stroke="#263c3b" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M500 406 548 478 520 613" fill="none" stroke="#efb455" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M518 609Q533 614 541 627L570 641Q549 649 516 637L507 631Z" fill="#f3ba5d" stroke="#263c3b" stroke-width="4" stroke-linejoin="round"/>
  <path d="m537 629 17 10m-26-8 9 9" fill="none" stroke="#ce9041" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Small motion marks and roadside grasses. -->
  <g fill="none" stroke-linecap="round">
    <path d="M231 374h52m-73 18h51m-19 19h31" stroke="#a6b8a9" stroke-width="4"/>
    <path d="m111 719-9-25m11 26 9-17m764 13 9-31m-6 33 19-15" stroke="#809c80" stroke-width="4"/>
  </g>
</svg>
